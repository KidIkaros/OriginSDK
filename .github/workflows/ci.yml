name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib -- --test-threads=2
      - run: cargo test --test integration_tests -- --test-threads=2
      - run: cargo test --test hybrid_golden_vectors
      - run: cargo test --test known_answer_vectors
      - run: cargo test --test differential_tests
      - run: cargo test --test malformed_input
      - run: cargo test --test timing_tests
      - run: cargo test --test adversarial -- --test-threads=1
        timeout-minutes: 10
      - run: cargo test --test ntru_prime_kat
        timeout-minutes: 5
      - run: cargo test --test falcon_kat
        timeout-minutes: 15

  hybrid-security:
    name: Hybrid security + RNG/cache tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test hybrid_security -- --test-threads=1
        timeout-minutes: 30
      - run: cargo test --test rng_and_cache -- --test-threads=2
        timeout-minutes: 30

  test-features:
    name: Test (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --lib -- --test-threads=2

  test-shake-features:
    name: Test (SHAKE KEM features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features ntru-shake128,ntru-shake256 --lib primitives::sha3

  test-blake3-kem:
    name: Test (BLAKE3 KEM feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features ntru-blake3 --lib pqc::ntru_prime
      - run: cargo test --features ntru-blake3 --test ntru_prime_kat
      - run: cargo test --features ntru-blake3 --test proptest_crypto -- prop_ntru

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --examples

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Pre-existing `unsafe` blocks (mlock, getrandom) and `expect()`
      # calls in test helpers are intentional — don't fail CI on them.
      # Real bugs are caught by `clippy::correctness` and `clippy::suspicious`
      # which are still set to warn (visible in output) but don't deny here.
      - run: cargo clippy --all-targets -- -A unsafe-code -A clippy::expect_used -A clippy::unwrap_used -A clippy::panic -W clippy::correctness -W clippy::suspicious

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  doctest:
    name: Doc tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --doc --features slh-dsa,ml-dsa,pqc-simd,test-utils

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  proptest:
    name: Property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test proptest_crypto -- --test-threads=2

  test-utils:
    name: Test utils feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features test-utils --lib test_utils

  coverage:
    name: Coverage gate (≥77%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-tarpaulin
          version: "0.37"
      - name: Run coverage with gate
        run: |
          cargo tarpaulin --lib \
            --features slh-dsa,ml-dsa,pqc-simd,test-utils \
            --engine Llvm \
            --out Html \
            --fail-under 77
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tarpaulin-report.html

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --no-default-features
      - run: cargo check --lib

  no-default-features:
    name: No-default-features check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --no-default-features
      - run: cargo check --lib --no-default-features --features parallel
      - run: cargo check --lib --no-default-features --features slh-dsa,ml-dsa

  wasm-check:
    name: WASM check (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --target wasm32-unknown-unknown --no-default-features --features wasm

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit
          version: "0.22"
      - run: cargo audit --deny warnings

  deny:
    name: License & ban check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-deny
          version: "0.19"
      - run: cargo deny check

  sanitizer-address:
    name: AddressSanitizer (best effort)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Run tests with AddressSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=0"
        run: |
          cargo +nightly test -Zbuild-std --lib -- --test-threads=2
          cargo +nightly test -Zbuild-std --test known_answer_vectors
          cargo +nightly test -Zbuild-std --test malformed_input

  sanitizer-thread:
    name: ThreadSanitizer (best effort)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Run tests with ThreadSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=thread"
          TSAN_OPTIONS: "halt_on_error=1"
        run: |
          cargo +nightly test -Zbuild-std --lib -- --test-threads=2
          cargo +nightly test -Zbuild-std --test known_answer_vectors
          cargo +nightly test -Zbuild-std --test malformed_input

  fuzz-smoke:
    name: Fuzz smoke test (60s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz targets for 60s each
        run: |
          # libFuzzer exits 0 on clean -max_total_time expiry; a crash, hang
          # (timeout kill → 124), or build error exits non-zero and fails the job.
          for target in fuzz_chacha40 fuzz_encrypt_decrypt fuzz_hybrid_verify fuzz_kdf fuzz_reed_solomon fuzz_ntru_prime fuzz_falcon fuzz_blob; do
            echo "=== Fuzzing $target ==="
            timeout 120s cargo +nightly fuzz run "$target" -- -max_len=4096 -max_total_time=60
          done

  benchmark:
    name: Benchmark regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        run: |
          # Benchmarks must run cleanly — this catches broken bench code
          # (e.g. API drift) which || true previously masked. Numeric
          # regression gating requires a same-machine before/after
          # comparison; see docs/BENCHMARKS.md for the recorded baseline.
          cargo bench --features slh-dsa,ml-dsa,pqc-simd,test-utils
        timeout-minutes: 30
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion/

