[package]
name = "origin-crypto-sdk-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
origin-crypto-sdk = { path = ".." }

[dependencies.libfuzzer-sys]
version = "0.4"

[[bin]]
name = "fuzz_encrypt_decrypt"
path = "fuzz_targets/fuzz_encrypt_decrypt.rs"

[[bin]]
name = "fuzz_hybrid_verify"
path = "fuzz_targets/fuzz_hybrid_verify.rs"

[[bin]]
name = "fuzz_kdf"
path = "fuzz_targets/fuzz_kdf.rs"

[[bin]]
name = "fuzz_chacha40"
path = "fuzz_targets/fuzz_chacha40.rs"

[[bin]]
name = "fuzz_reed_solomon"
path = "fuzz_targets/fuzz_reed_solomon.rs"

[[bin]]
name = "fuzz_ntru_prime"
path = "fuzz_targets/fuzz_ntru_prime.rs"

[[bin]]
name = "fuzz_falcon"
path = "fuzz_targets/fuzz_falcon.rs"

[[bin]]
name = "fuzz_blob"
path = "fuzz_targets/fuzz_blob.rs"
